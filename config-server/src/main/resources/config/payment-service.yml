server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: banking
    password: banking
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: payment-service-group
