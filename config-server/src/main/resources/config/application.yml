eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: "banking-demo-jwt-secret-key-must-be-at-least-32-bytes-long"
    access-token-ttl: 15m
    refresh-token-ttl: 7d
