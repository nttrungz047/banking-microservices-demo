spring:
  application:
    name: payment-service-test
  datasource:
    url: jdbc:h2:mem:payment_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-test-group
      auto-offset-reset: earliest

eureka:
  client:
    enabled: false
