spring:
  application:
    name: notification-service-test
  datasource:
    url: jdbc:h2:mem:notification_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-test-group
  mail:
    host: localhost
    port: 1025

app:
  notification:
    mail:
      from: noreply@banking.local
      enabled: true

eureka:
  client:
    enabled: false
