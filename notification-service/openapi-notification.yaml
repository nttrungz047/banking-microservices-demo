openapi: 3.1.0
info:
  title: Notification API
  description: |
    Query notification logs and simulated email deliveries.
    Transfer events (completed, failed) are consumed via Kafka and sent as email notifications.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: API Gateway
  - url: http://localhost:8085
    description: Notification Service (direct, development only)

tags:
  - name: Notification
    description: Notification query endpoints

paths:
  /api/notifications:
    get:
      tags: [Notification]
      summary: Query notifications
      operationId: getNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: query
          required: false
          description: Filter notifications by payment ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/{id}:
    get:
      tags: [Notification]
      summary: Get notification by ID
      operationId: getNotificationById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Notification ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 'Notification not found: 7f6d5e2e-d2d7-43bf-b0a8-b8b15cfdc5d2'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT issued by Auth Service.
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or non-access JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Invalid or expired token
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Bad request
  schemas:
    NotificationResponse:
      type: object
      required: [id, eventId, recipient, subject, content, type, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
        paymentId:
          type: [string, 'null']
          format: uuid
        fromAccountId:
          type: [string, 'null']
          format: uuid
        toAccountId:
          type: [string, 'null']
          format: uuid
        amount:
          type: [number, 'null']
          format: decimal
        recipient:
          type: string
        subject:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [TRANSFER_COMPLETED, TRANSFER_FAILED]
        status:
          type: string
          enum: [SENT, FAILED]
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: [string, 'null']
          format: date-time
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
